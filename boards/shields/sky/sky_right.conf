CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
CONFIG_ZMK_KEYBOARD_NAME="SKY"

CONFIG_ZMK_SLEEP=y


CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_ZMK_MOUSE=y
CONFIG_PMW3610_INO=y
CONFIG_SENSOR=y

CONFIG_PMW3610_INO_SMART_ALGORITHM=y

CONFIG_PMW3610_INO_ORIENTATION_90=y
CONFIG_PMW3610_INO_INVERT_Y=y

CONFIG_PMW3610_INO_CPI=2600
CONFIG_PMW3610_INO_CPI_DIVIDOR=3

CONFIG_PMW3610_INO_SCROLL_TICK=100

CONFIG_PMW3610_INO_RUN_DOWNSHIFT_TIME_MS=3264
CONFIG_PMW3610_INO_REST1_SAMPLE_TIME_MS=20

CONFIG_BT_CTLR_TX_PWR_PLUS_8=y


CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# give time to open serial terminal before boot logs flush
CONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=10000
